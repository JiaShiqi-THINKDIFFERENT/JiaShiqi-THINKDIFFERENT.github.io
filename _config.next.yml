# ==============================================================
# NexT 主题个性化配置
# 此文件为"备用主题配置"(Alternate Theme Config)，会自动与
# themes/next/_config.yml 合并覆盖，升级主题时不会被覆盖丢失。
# 文档: https://theme-next.js.org/docs/getting-started/configuration
# ==============================================================

# Scheme 布局方案: Muse | Mist | Pisces | Gemini
scheme: Gemini

# 深色模式：true = 跟随系统自动切换
darkmode: true

# ---------------------------------------------------------------
# 主题色（深墨绿）
# theme_color 为浏览器顶部面板色；全局配色通过 styles.styl 覆盖 CSS 变量
# ---------------------------------------------------------------
theme_color:
  light: "#1b4d3e"
  dark: "#14352b"

custom_file_path:
  style: source/_data/styles.styl
  head: source/_data/head.njk                  # 首屏恢复侧栏折叠态，避免闪烁
  header: source/_data/header.njk              # 顶部吸顶导航条（P0-1）
  postBodyEnd: source/_data/post-body-end.njk   # Artalk 评论区占位（文章页）
  bodyEnd: source/_data/body-end.njk            # Artalk 统一加载与初始化

# ---------------------------------------------------------------
# 文章元信息
# 注：NexT 的 post-meta 模板本身不渲染 tags，列表页卡片的标签 / 字数 /
#     阅读时长 / 封面均由 posts-meta.json + source/js/post-meta-extra.js
#     注入（P0-3），不依赖 hexo-symbols-count-time 插件（未安装）。
# ---------------------------------------------------------------
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# ---------------------------------------------------------------
# 菜单设置
# ---------------------------------------------------------------
# 站点导航项全部放在侧栏菜单；顶部导航条只放折叠按钮 + CLIVIA 字标
menu:
  home: / || fa fa-home
  stocks: /stocks/ || fa fa-line-chart
  three-good: /three-good/ || fa fa-star
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user

menu_settings:
  icons: true
  badges: true

# ---------------------------------------------------------------
# 侧边栏设置
# ---------------------------------------------------------------
sidebar:
  position: left
  display: post

# 侧边栏头像（可放入 source/uploads/avatar.png 后取消注释）
# avatar:
#   url: /uploads/avatar.png
#   rounded: true
#   rotated: false

# ---------------------------------------------------------------
# 社交链接
# ---------------------------------------------------------------
social:
  GitHub: https://github.com/JiaShiqi-THINKDIFFERENT || fab fa-github

social_icons:
  enable: true
  icons_only: false
  transition: true

# ---------------------------------------------------------------
# 页脚设置
# ---------------------------------------------------------------
footer:
  since: 2026
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff2d55"
  powered: true

# ---------------------------------------------------------------
# 文章目录
# ---------------------------------------------------------------
toc:
  enable: true
  number: true
  expand_all: true
  max_depth: 6
